trigger:
  - develop

pool:
  name: 'CICD_Testing'
  demands:
    - Agent.Name -equals DESKTOP-UIPATH

steps:

# 1. Ejecutar las pruebas automatizadas del proyecto
- task: UiPathTest@6
  inputs:
    testTarget: 'TestProject'
    orchestratorConnection: 'UiPath_TestConnection'
    projectKey: '9193efec-8988-0000-b111-0b49fcaa3f63'
    testProjectPath: 'project.json'
    environment: 'IniciaME'
    folderName: 'Azure_Testing'
    testReportDestination: '$(Build.ArtifactStagingDirectory)/testResult.xml'
    skipResultsPublishing: true
    traceLevel: 'Verbose'

# 2. Empaquetar el proyecto de UiPath (.nupkg)
- task: UiPathPack@6
  inputs:
    projectJsonPath: '$(Build.SourcesDirectory)/project.json'
    versionType: 'AutoVersion'
    outputPath: '$(Build.ArtifactStagingDirectory)'
    orchestratorConnection: 'UiPath_TestConnection'

# 3. Publicar los resultados y el paquete en Azure DevOps
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'